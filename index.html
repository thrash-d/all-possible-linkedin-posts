  // Filled from lexicon.json. Each POS is an array of rows; columns per POS
  // come from LEX.columns. We index columns by name once loaded.
  let LEX = null, COL = {}, THEMES = [], themeNames = [];

  function col(pos, name) { return COL[pos][name]; }
  function wordRow(pos, i) { return LEX.words[pos][i]; }

  // ---------- rng ----------
  // Every post is one string seed. A string-seeded mulberry32 gives a repeatable
  // stream, so a copied link rebuilds the exact post regardless of the feed
  // around it. Inlined so the page has no external dependency.
  function makeRng(seed) {
    let h = 1779033703 ^ seed.length;
    for (let i = 0; i < seed.length; i++) {
      h = Math.imul(h ^ seed.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    let a = h >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randSeed() { return Math.random().toString(36).slice(2, 11); }

  // A picker bound to one post: theme + coherence decide the candidate pool.
  function makePicker(rng, themeIdx, coherence) {
    const theme = themeIdx == null ? null : THEMES[themeIdx];
    // coherence: 0 chaos .. 3 tight. Blend of theme pool, corp score, whole dict.
    const themeWeight = [0, 0.45, 0.7, 0.9][coherence];
    const corpBias = [0, 0.15, 0.4, 0.75][coherence];
    const wildChance = [1, 0.5, 0.25, 0.12][coherence];

    function fromWhole(pos) {
      const arr = LEX.words[pos];
      return arr[Math.floor(rng() * arr.length)];
    }
    function fromTheme(pos) {
      if (!theme || !theme[pos] || !theme[pos].length) return fromWhole(pos);
      const list = theme[pos];
      return LEX.words[pos][list[Math.floor(rng() * list.length)]];
    }
    function fromCorp(pos) {
      // rejection-sample toward higher corp score
      const c = col(pos, "corp");
      if (c == null) return fromWhole(pos);
      let best = fromWhole(pos);
      for (let k = 0; k < 3; k++) {
        const cand = fromWhole(pos);
        if ((cand[c] || 0) > (best[c] || 0)) best = cand;
      }
      return best;
    }
    function pick(pos) {
      const r = rng();
      let row;
      if (r < themeWeight) row = fromTheme(pos);
      else if (r < themeWeight + corpBias) row = fromCorp(pos);
      else row = fromWhole(pos);
      // occasional wild word from the whole dictionary regardless
      if (rng() < wildChance * 0.4) row = fromWhole(pos);
      return row;
    }
    // Draws from a fixed list on this post's stream, so seeds stay reproducible.
    pick.from = arr => arr[Math.floor(rng() * arr.length)];
    return pick;
  }

  // Built once from the lexicon's scores. THING is common, concrete nouns
  // (potato, choir); CORP is common, corporate-sounding words (accountability).
  // Pairing the two is the whole LinkedIn move: "What my potato taught me
  // about accountability."
  let THING = [], CORP = {}, CORP_BY_LETTER = {};
  function buildPools() {
    const word = pos => col(pos, "word");
    const common = (pos, min) => r => r[col(pos, "zipf")] >= min && /^[a-z]{3,}$/.test(r[word(pos)]);
    THING = LEX.words.NOUN.filter(r => r[col("NOUN", "concrete")] && common("NOUN", 3.8)(r));
    for (const pos of ["NOUN", "ADJ", "VERB"]) {
      CORP[pos] = LEX.words[pos].filter(r => r[col(pos, "corp")] >= 85 && common(pos, 3.5)(r));
    }
    // Looser pool for acronym letters, so rare letters still find a word.

    for (const r of LEX.words.NOUN) {

    // A leading capital letter ({Noun}, {Verb}) capitalizes the result.
    // {N} = number, {L} = a Series letter, {title} and {company} = made-up ones.
    return tmpl.replace(/\{([A-Za-z]+(?:\.[a-z]+)?)\}/g, (m, tok) => {

      const out = form(pick, tok.toLowerCase());
      return capFlag ? cap(out) : out;

        x(one(["This is the hardest post I've ever written.", "Today I had to let {N} {noun.pl} go.", "I'm sharing a photo of me crying. Here's why."], rng)),
        x(one(["We grew too fast. We {cverb.past} too much {corp}.", "The market {verb.past}. Our {corp} didn't.", "I made {cadj} decisions. Some were wrong."], rng)),
        x(one(["If you're hiring, these are the most {cadj} {noun.pl} I know.", "Every one of them could {verb} a {thing} blindfolded.", "I'll write a recommendation for every single one."], rng)),
        x(one(["Leadership is lonely.", "I take full responsibility. (Our Series {L} closes Monday.)", "Hug your team today."], rng))
      ];
    },

    coldDm: (pick, rng) => {
      const x = f(pick, rng);
      return [
        one(["Got this DM today:", "A stranger messaged me at 2 a.m.:", "This landed in my inbox this morning:"], rng),
        x(one(["\"Hi, I see you're a {title}. Can I pick your brain about {corp}?\"", "\"Your post about {thing.pl} changed my life. I quit my job.\"", "\"Hey, quick question: how do I {cverb} my {corp}?\""], rng)),
        x(one(["I replied with one word: \"{Corp}.\"", "I sent them a {thing}.", "I didn't reply. I posted it here instead."], rng)),
        x(one(["Be the {noun} you'd want in your DMs.", "Your inbox is your {corp}.", "Kindness is free. {Corp} isn't."], rng))
      ];
    },

    framework: (pick, rng) => {
      const x = f(pick, rng);
      const short = THING.filter(r => { const w = r[col("NOUN", "word")]; return w.length >= 4 && w.length <= 6; });
      const word = one(short, rng)[col("NOUN", "word")].toUpperCase();
      const acr = [...word].join(".") + ".";
      const lines = [...word].map(ch => {
        const pool = CORP_BY_LETTER[ch.toLowerCase()] || CORP.NOUN;
        return `${ch}: ${cap(one(pool, rng)[col("NOUN", "word")])}`;
      });
      return [
        x(one([
          `After {N} years of {cverb.ing} {corp.pl}, I built the ${acr} Framework™.`,
          `Introducing the ${acr} method for {cadj} {corp}.`,
          `Every {corp} win I've had comes down to ${acr}`
        ], rng)),
        lines.join("\n"),
        x(one(["I've used it with {N} Fortune 500 {noun.pl}.", "It's never failed me. Not once.", "Simple. Not easy."], rng)),
        `Comment "${word}" and I'll DM you the template.`
      ];
    }
  };
  // The classic story format gets ten shares; each other format gets one.
  const FORMAT_DRAW = Object.keys(FORMATS).concat(Array(9).fill("story"));

  // ---------- names / companies / titles ----------
  const SUFFIXES = ["ly", "ify", "r", ".ai", " Labs", " Collective", " Ventures", "wise", "gen", "hub", "io",
    " Partners", " Group", "flow", "stack", " & Co", "ster", " Global", " Dynamics", "base",
    "ology", " Studio", "able", "verse", " Systems", "ly.io"];
  function makeCompany(pick, rng) {
    const w = one(["noun", "thing", "corp"], rng);
    return cap(form(pick, w)) + one(SUFFIXES, rng);
  }
  function makeTitle(pick, rng) {
    return one([
      () => `Chief ${cap(form(pick, "noun"))} Officer`,
      () => `Chief ${cap(form(pick, "corp"))} Officer`,
      () => `VP of ${cap(form(pick, "verb.ing"))}`,
      () => `Head of ${cap(form(pick, "noun"))}`,
      () => `Head of ${cap(form(pick, "corp"))} & ${cap(form(pick, "thing.pl"))}`,
      () => `${cap(form(pick, "adj"))} ${cap(form(pick, "noun"))} Evangelist`,
      () => `Senior ${cap(form(pick, "thing"))} Strategist`,
      () => `${cap(form(pick, "corp"))} Ninja`,
      () => `Director of ${cap(form(pick, "cadj"))} ${cap(form(pick, "corp"))}`,
      () => `Global ${cap(form(pick, "thing"))} Lead`,
      () => `Fractional ${cap(form(pick, "corp"))} Officer`,
      () => `${cap(form(pick, "thing"))} Whisperer`,
      () => `Founder & CEO`,
      () => `Serial Entrepreneur`,
      () => `${cap(form(pick, "thing"))} Evangelist`,
      () => `Chief of ${cap(form(pick, "thing.pl"))}`,
      () => `Principal ${cap(form(pick, "corp"))} Architect`,
      () => `${cap(form(pick, "cadj"))} Growth Hacker`
    ], rng)();
  }
  function makeIdentity(pick, rng) {
    const first = cap(form(pick, "propn"));
    const last = cap(form(pick, "propn"));
    const company = makeCompany(pick, rng);
    const title = makeTitle(pick, rng);
    const tagline = one([
      () => `Helping ${form(pick, "noun.pl")} ${form(pick, "verb.base")} their ${form(pick, "noun.pl")}`,
      () => `${cap(form(pick, "adj"))} thinker | ${cap(form(pick, "noun"))} enthusiast`,
      () => `Top ${cap(form(pick, "noun"))} Voice`,
      () => `Ex-${cap(form(pick, "propn"))} | ${cap(form(pick, "noun"))} nerd`,
      () => `${cap(form(pick, "corp"))} • ${cap(form(pick, "corp"))} • ${cap(form(pick, "thing.pl"))}`,
      () => `I help ${form(pick, "cadj")} leaders ${form(pick, "cverb")} their ${form(pick, "corp")}`,
      () => `${fmt(1 + Math.floor(rng() * 90))}K followers | Keynote speaker on ${form(pick, "corp")}`,
      () => `Dad. ${cap(form(pick, "thing"))} collector. ${cap(form(pick, "corp"))} obsessive.`,
      () => `Building the future of ${form(pick, "thing.pl")}`,
      () => `${cap(form(pick, "thing"))}-first ${form(pick, "corp")} | Opinions my own`,
      () => `Author of "The ${cap(form(pick, "thing"))} Mindset"`,
      () => `Turning ${form(pick, "thing.pl")} into ${form(pick, "corp")}`,
      () => `Ex-${cap(form(pick, "thing"))} | Now ${cap(form(pick, "corp"))}`,
      () => `${cap(form(pick, "corp"))} is my love language`,
      () => `Recovering ${form(pick, "noun")} | ${cap(form(pick, "thing"))} dad`
    ], rng)();
    return { name: `${first} ${last}`, headline: `${title} @ ${company} | ${tagline}`, first };
  }

  function makeHashtags(pick, rng, n) {
    const tags = new Set();
    let guard = 0;
    while (tags.size < n && guard++ < n * 4) {
      const w = form(pick, "noun");
      tags.add("#" + w.split(/[\s-]/).map(cap).join(""));
    }
    return [...tags];
  }

  // ---------- haiku mode ----------
  function sylOf(pos, row) { const c = col(pos, "syl"); return c == null ? 2 : (row[c] || 2); }
  function haikuLine(pick, rng, target) {
    // greedy fill NOUN/ADJ/VERB toward a syllable target
    const order = ["adj", "noun", "verb"];
    let out = [], total = 0, guard = 0;
    while (total < target && guard++ < 40) {
      const spec = order[Math.floor(rng() * order.length)];
      const pos = spec === "adj" ? "ADJ" : spec === "verb" ? "VERB" : "NOUN";
      const row = pick(pos);
      const s = sylOf(pos, row);
      if (total + s > target) continue;
      out.push(row[col(pos, "word")]);
      total += s;
    }
    return out.join(" ");
  }
  function buildHaiku(pick, rng) {
    const lines = [haikuLine(pick, rng, 5), haikuLine(pick, rng, 7), haikuLine(pick, rng, 5)];
    return cap(lines.join("\n"));
  }

  // ---------- post assembly ----------
  function expandBeat(cat, pick, rng) {
    if (cat === "lesson2" || cat === "lesson3") {
      const n = cat === "lesson2" ? 2 : 3;
      const chosen = shuffle(T.lesson.slice(), rng).slice(0, n);
      return chosen.map((t, i) => ["1️⃣", "2️⃣", "3️⃣"][i] + " " + fillTemplate(t, pick, rng)).join("\n");
    }
    const pool = T[cat];
    const t = pool[Math.floor(rng() * pool.length)];
    return fillTemplate(t, pick, rng);
  }
  function shuffle(a, rng) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function applyDashes(text, level, rng) {
    if (!level) return text;
    const parts = text.split(". ");
    if (parts.length < 2) return text;
    const want = level === 3 ? parts.length : Math.min(parts.length - 1, level);
    for (let k = 0; k < want; k++) parts[k] = parts[k] + " —";
    return parts.join(level === 3 ? " " : ". ").replace(/—\. /g, "— ").replace(/— ([a-z])/g, (m, c) => "— " + c);
  }

  function build(seed, dials) {
    const rng = makeRng(seed);
    const themeIdx = Math.floor(rng() * THEMES.length);
    const pick = makePicker(rng, themeIdx, dials.coh);
    const id = makeIdentity(pick, rng);

    let text;
    if (dials.haiku) {
      text = buildHaiku(pick, rng);
    } else {
      const beats = FORMATS[one(FORMAT_DRAW, rng)](pick, rng);
      // insert brags per humblebrag dial
      if (dials.brag) {
        for (let k = 0; k < dials.brag; k++) {
          const at = 1 + Math.floor(rng() * Math.max(1, beats.length - 1));
          beats.splice(at, 0, expandBeat("brag", pick, rng));
        }
      }
      text = beats.join("\n\n");
      text = applyDashes(text, dials.dash, rng);
      if (dials.tags) text += "\n\n" + makeHashtags(pick, rng, dials.tags).join(" ");
    }

    const reactions = Math.floor(200 + rng() ** 2 * 40000);
    const comments = Math.floor(reactions * (0.03 + rng() * 0.12));
    const reposts = Math.floor(reactions * (0.005 + rng() * 0.03));
    return { seed, ...id, text, reactions, comments, reposts, age: ["2h", "5h", "1d", "3d", "1w"][Math.floor(rng() * 5)] };
  }

  // ---------- render ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmt = n => n.toLocaleString("en-US");
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1400); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { toast("Copy blocked here. Select the text instead."); } }

  function dials() { return { coh: +$("coh").value, brag: +$("brag").value, dash: +$("dash").value, tags: +$("tags").value, haiku: $("haiku").checked }; }

  function renderPost(seed) {
    const p = build(seed, dials());
    const art = el("article", "post");
    art.dataset.seed = seed;
    const author = el("div", "author");
    author.append(el("div", "avatar", p.name.split(" ").map(s => s[0]).join("")));
    const who = el("div", "who");
    who.append(el("span", "name", p.name), el("span", "headline", p.headline), el("span", "meta", `${p.age} · Edited`));
    author.append(who);
    const body = el("div", "body", p.text);
    const stats = el("div", "stats", `${fmt(p.reactions)} reactions · ${fmt(p.comments)} comments · ${fmt(p.reposts)} reposts`);
    const actions = el("div", "actions");
    const cText = el("button", null, "Copy text"); cText.type = "button"; cText.addEventListener("click", () => copy(build(seed, dials()).text));
    const cLink = el("button", null, "Copy link"); cLink.type = "button";
    cLink.addEventListener("click", () => copy(location.href.split("#")[0] + "#p" + seed));
    actions.append(cText, cLink, el("span", "no", seed));
    art.append(author, body, stats, actions);
    return art;
  }
  function append(n) { for (let i = 0; i < n; i++) feed.append(renderPost(randSeed())); }
  function rerender() { const seeds = [...feed.children].map(a => a.dataset.seed); feed.replaceChildren(...seeds.map(renderPost)); }

  const cohLabels = ["chaos", "loose", "on-brand", "peak"];
  const bragLabels = ["none", "subtle", "noticeable", "Bali"];
  const dashLabels = ["none", "some", "many", "———"];
  function syncOutputs() { const d = dials(); $("cohOut").textContent = cohLabels[d.coh]; $("bragOut").textContent = bragLabels[d.brag]; $("dashOut").textContent = dashLabels[d.dash]; $("tagsOut").textContent = String(d.tags); }

  ["coh", "brag", "dash", "tags"].forEach(id => $(id).addEventListener("input", () => { syncOutputs(); rerender(); }));
  $("haiku").addEventListener("change", rerender);
  $("refresh").addEventListener("click", () => { feed.replaceChildren(); append(3); window.scrollTo({ top: 0 }); });

  function start() {
    COL = {};
    for (const pos in LEX.columns) { COL[pos] = {}; LEX.columns[pos].forEach((name, i) => COL[pos][name] = i); }
    themeNames = Object.keys(LEX.themes);
    THEMES = themeNames.map(name => LEX.themes[name]);
    buildPools();
    const wc = Object.values(LEX.words).reduce((a, r) => a + r.length, 0);
    const shapes = SKELETONS.length + Object.keys(FORMATS).length - 1;
    $("count").textContent = `${fmt(wc)} words × ${shapes} post shapes × ${themeNames.length} themes.`;
    $("loading").textContent = "The feed doesn't end.";
    syncOutputs();
    const linked = /^#p([a-z0-9]+)$/i.exec(location.hash);
    if (linked) feed.append(renderPost(linked[1]));
    append(linked ? 2 : 3);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) append(3); }, { rootMargin: "600px" }).observe($("sentinel"));
    }
  }

  function fail(msg) { $("count").textContent = ""; $("loading").textContent = msg; }
  fetch("lexicon.json")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " fetching lexicon.json"); return r.json(); })
    .then(d => { LEX = d; start(); })
    .catch(e => fail("Couldn't build the feed: " + e.message));
})();
</script>

</body>
</html>
